# Сборка спутникового снимка области для приложения ТАЙГА.
#
# ДОБАВЛЕНО 04.10.2026 — проба спутника на Ленинградской области (EOX).
# ИЗМЕНЕНО 22.10.2026 — основной источник теперь Copernicus: квартальные
# безоблачные мозаики Sentinel-2 (tools-sputnik-cdse.py, там же разбор
# источника, масштаба и цвета). EOX 2017 (tools-sputnik.py) остался
# запасным — его можно заказать словом EOX.
#
# КАК ЗАПУСТИТЬ. Файлом заказа: вписать в zakaz-sputnik.txt одну строку
# и сохранить в main. Строки с решёткой — комментарии.
#   LENOBL            — Ленобласть, самое свежее лето (Q3) Copernicus;
#   LENOBL 2025-Q3    — Ленобласть, именно этот квартал;
#   LENOBL EOX        — Ленобласть по-старому, EOX 2017 (НЕ ЗАПУСКАТЬ
#                       до ответа EOX на письмо cloudless@eox.at).
# Одна область за раз: снимок области — это несколько часов, а у GitHub
# предел шесть часов на задачу.
#
# КЛЮЧИ. Copernicus отдаёт снимки только с ключами S3. Их нужно один раз
# положить в секреты репозитория: Settings → Secrets and variables →
# Actions → New repository secret, имена CDSE_S3_ACCESS_KEY и
# CDSE_S3_SECRET_KEY. Без них задача останавливается на первом же шаге
# и пишет, что сделать. Сами ключи в журнал не попадают.
#
# Готовый файл кладётся на полку области — в выпуск TAIGA-<КЛЮЧ>,
# рядом с пакетами слоёв: там его ищет приложение (region/SatPack).
# Имя файла прежнее — TAIGA-<КЛЮЧ>-satellite.mbtiles, приложение менять
# не нужно. Рядом — файл с отпечатком SHA-256.

name: Собрать спутник ТАЙГА

on:
  push:
    branches:
      - main
    paths:
      - zakaz-sputnik.txt

permissions:
  contents: write

concurrency:
  group: sputnik
  cancel-in-progress: false

jobs:
  sputnik:
    name: Спутник
    runs-on: ubuntu-24.04
    # Шесть часов — потолок GitHub; оставляем запас на выкладку.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Разобрать заказ
        id: order
        run: |
          LINE="$(grep -v '^[[:space:]]*#' zakaz-sputnik.txt | tr -d '\r' | grep -m1 '[^[:space:]]' || true)"
          KEY="$(echo "$LINE" | awk '{print $1}')"
          SECOND="$(echo "$LINE" | awk '{print $2}' | tr 'a-z' 'A-Z')"
          if [ -z "$KEY" ]; then
            echo "::error::Заказ пуст — собирать нечего. Впишите в zakaz-sputnik.txt ключ области, например LENOBL."
            exit 1
          fi
          case "$KEY" in
            *[!A-Z0-9_-]*) echo "::error::Странный ключ области: $KEY"; exit 1 ;;
          esac
          SOURCE=cdse
          QUARTER=""
          case "$SECOND" in
            "") ;;
            EOX) SOURCE=eox ;;
            20[0-9][0-9]-Q[1-4]) QUARTER="$SECOND" ;;
            *) echo "::error::Второе слово заказа «$SECOND» непонятно. Можно: квартал вида 2026-Q3 или EOX."; exit 1 ;;
          esac
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "quarter=$QUARTER" >> "$GITHUB_OUTPUT"
          echo "Заказ: область $KEY, источник $SOURCE${QUARTER:+, квартал $QUARTER}"

      - name: Проверить ключи Copernicus
        if: steps.order.outputs.source == 'cdse'
        env:
          A: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          S: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          if [ -n "$A" ] && [ -n "$S" ]; then
            echo "Ключи на месте."
            exit 0
          fi
          echo "::error::Нет ключей Copernicus — снимок не скачать."
          echo "НЕТ КЛЮЧЕЙ COPERNICUS. Что сделать (один раз):"
          echo " 1) Зарегистрироваться на https://dataspace.copernicus.eu (бесплатно)."
          echo " 2) Войти на https://eodata-s3keysmanager.dataspace.copernicus.eu/"
          echo "    и нажать «Add Credentials», указать срок действия, «Confirm»."
          echo "    Secret Key показывается ОДИН раз — сразу скопировать."
          echo " 3) Здесь, в GitHub: Settings → Secrets and variables → Actions →"
          echo "    New repository secret. Два секрета:"
          echo "      CDSE_S3_ACCESS_KEY — Access Key"
          echo "      CDSE_S3_SECRET_KEY — Secret Key"
          echo " 4) Заново сохранить zakaz-sputnik.txt (любая правка) — сборка пойдёт."
          [ -n "$A" ] || echo "Не хватает: CDSE_S3_ACCESS_KEY"
          [ -n "$S" ] || echo "Не хватает: CDSE_S3_SECRET_KEY"
          exit 1

      - uses: actions/setup-python@v5
        if: steps.order.outputs.source == 'cdse'
        with:
          python-version: "3.12"

      - name: Поставить библиотеки
        if: steps.order.outputs.source == 'cdse'
        run: |
          python -m pip install --only-binary=:all: -r requirements-sputnik.txt
          python -c "import rasterio; print('rasterio', rasterio.__version__, 'GDAL', rasterio.__gdal_version__)"

      - name: Проверки сборщика
        if: steps.order.outputs.source == 'cdse'
        run: python -m unittest discover -s tests -v

      - name: Посчитать плитки и снимки
        if: steps.order.outputs.source == 'cdse'
        run: |
          python tools-sputnik-cdse.py --key "${{ steps.order.outputs.key }}" \
            --quarter "${{ steps.order.outputs.quarter }}" --count-only

      - name: Собрать снимок Copernicus
        if: steps.order.outputs.source == 'cdse'
        env:
          CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
          CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
        run: |
          python tools-sputnik-cdse.py --key "${{ steps.order.outputs.key }}" \
            --quarter "${{ steps.order.outputs.quarter }}"

      # Запасной путь — старый сборщик EOX 2017, без изменений.
      - name: Посчитать плитки (EOX)
        if: steps.order.outputs.source == 'eox'
        run: python3 tools-sputnik.py --key "${{ steps.order.outputs.key }}" --count-only

      - name: Скачать снимок (EOX)
        if: steps.order.outputs.source == 'eox'
        run: python3 tools-sputnik.py --key "${{ steps.order.outputs.key }}" --rate 3

      - name: Проверить файл
        run: |
          F="TAIGA-${{ steps.order.outputs.key }}-satellite.mbtiles"
          ls -l "$F"
          # Меньше мегабайта на область — значит скачалось не то.
          [ "$(stat -c %s "$F")" -gt 1048576 ]
          python3 - "$F" <<'EOF'
          import sqlite3, sys
          d = sqlite3.connect(sys.argv[1])
          meta = dict(d.execute("select name, value from metadata"))
          for k in ("name", "format", "bounds", "minzoom", "maxzoom", "attribution", "description"):
              print(k, "=", meta.get(k))
          assert meta.get("format") in ("jpg", "png"), "формат плиток не тот"
          print("плиток по уровням:", d.execute(
              "select zoom_level, count(*) from tiles group by zoom_level").fetchall())
          head = d.execute("select substr(tile_data, 1, 3) from tiles limit 1").fetchone()[0]
          assert bytes(head) == b"\xff\xd8\xff", "плитка не JPEG"
          EOF
          sha256sum "$F" | cut -d' ' -f1 > "$F.sha256"

      - name: Положить на полку области
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="TAIGA-${{ steps.order.outputs.key }}"
          F="$TAG-satellite.mbtiles"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG: слои области" \
              --notes "Пакеты слоёв и спутниковый снимок области для приложения ТАЙГА."
          gh release upload "$TAG" "$F" --clobber
          gh release upload "$TAG" "$F.sha256" --clobber
